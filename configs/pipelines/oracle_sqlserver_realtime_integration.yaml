apiVersion: dataplat.zielinski.io/v1alpha1
kind: DataPipeline
metadata:
  name: oracle-sqlserver-realtime-integration
  namespace: data-platform
spec:
  domain: insurance
  sources:
  - name: abassurance
    type: sqlserver
    connectionSecretRef:
      name: abassurance-connection
    tables:
    - sourceTable: Building
      primaryKey: BuildingId
      targetEntity: building
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.building
    - sourceTable: Claims
      primaryKey: ClaimId
      targetEntity: claim
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.claim
    - sourceTable: Holder
      primaryKey: HolderId
      targetEntity: holder
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.holder
    - sourceTable: HolderClassification
      primaryKey: HolderClassificationId
      targetEntity: holder_classification
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.holder_classification
    - sourceTable: Policy
      primaryKey: PolicyId
      targetEntity: policy
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.policy
    - sourceTable: PolicyRating
      primaryKey: PolicyRatingId
      targetEntity: policy_rating
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.policy_rating
    - sourceTable: PolicyTerms
      primaryKey: PolicyTermsId
      targetEntity: policy_terms
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.policy_terms
    - sourceTable: PolicyUnit
      primaryKey: PolicyUnitId
      targetEntity: policy_unit
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.policy_unit
    - sourceTable: PremiumFinancial
      primaryKey: PremiumFinancialId
      targetEntity: premium_financial
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.premium_financial
    - sourceTable: PrivateClient
      primaryKey: HolderId
      targetEntity: private_client
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.private_client
    - sourceTable: Property
      primaryKey: PropertyId
      targetEntity: property
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.property
    - sourceTable: PropertyUsage
      primaryKey: PropertyUsageId
      targetEntity: property_usage
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.property_usage
    - sourceTable: Risks
      primaryKey: RiskId
      targetEntity: risks
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.risks
    cdc:
      engine: debezium
      snapshotMode: initial
  - name: assureplus
    type: oracle
    connectionSecretRef:
      name: assureplus-connection
    tables:
    - sourceTable: CLAIM
      primaryKey: CLAIM_ID
      targetEntity: claim
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.claim
    - sourceTable: HOLDER
      primaryKey: HOLDER_CONTEXT
      targetEntity: holder
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.holder
    - sourceTable: POLICY
      primaryKey: POLICY_RECORD_ID
      targetEntity: policy
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.policy
    - sourceTable: POLICY_BUILDING_RISK
      primaryKey: POLICY_RECORD_ID
      targetEntity: risks
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.risks
    - sourceTable: POLICY_BUILDING_TECHNICAL
      primaryKey: POLICY_RECORD_ID
      targetEntity: building
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.building
    - sourceTable: POLICY_CONTRACT
      primaryKey: POLICY_RECORD_ID
      targetEntity: policy_terms
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.policy_terms
    - sourceTable: POLICY_HOLDER_CLASSIFICATION
      primaryKey: POLICY_RECORD_ID
      targetEntity: holder_classification
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.holder_classification
    - sourceTable: POLICY_PREMIUM_FINANCIAL
      primaryKey: POLICY_RECORD_ID
      targetEntity: premium_financial
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.premium_financial
    - sourceTable: POLICY_PROPERTY_LOCATION
      primaryKey: POLICY_RECORD_ID
      targetEntity: property
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.property
    - sourceTable: POLICY_PROPERTY_USAGE
      primaryKey: POLICY_RECORD_ID
      targetEntity: property_usage
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.property_usage
    - sourceTable: POLICY_RATING
      primaryKey: POLICY_RECORD_ID
      targetEntity: policy_rating
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.policy_rating
    - sourceTable: PRIVATE_CLIENT
      primaryKey: HOLDER_CONTEXT
      targetEntity: private_client
      bronzeTable: lakehouse.bronze.cdc_events
      silverTable: lakehouse.silver.private_client
    cdc:
      engine: debezium
      snapshotMode: initial
  kafka:
    partitions: 1
    replicationFactor: 1
