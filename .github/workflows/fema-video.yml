name: FEMA video checks
on:
  pull_request:
    branches: [develop, master]
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform/gcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.12.2'
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test
  sonar-recording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Show master Quality Gate and open security findings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python scripts/sonar_video.py Mayk-ITdS_data-platform --branch master --organization "${{ vars.SONAR_ORGANIZATION }}"

      - name: Identify uncovered files on master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python - <<'PYTHON'
          from scripts.sonar_video import query
          keys = "coverage,new_coverage,new_lines_to_cover,new_uncovered_lines"
          project = "Mayk-ITdS_data-platform"
          page = 1
          while True:
              data = query("measures/component_tree", component=project, branch="master",
                           metricKeys=keys, qualifiers="FIL", strategy="leaves", p=page, ps=100)
              for item in data["components"]:
                  metrics = {m["metric"]: m.get("value", (m.get("period") or (m.get("periods") or [{}])[0]).get("value"))
                             for m in item["measures"]}
                  if int(metrics.get("new_uncovered_lines") or 0):
                      print(item["path"], metrics)
              if page * 100 >= data["paging"]["total"]:
                  break
              page += 1
          PYTHON
