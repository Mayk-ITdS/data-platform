
name: FEMA quality

on:
  pull_request:
    branches: [master, develop]

  push:
    branches:
    - master
    - develop
    - 'feature/**'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-iceberg:
    name: Phase 1 - Unit and Iceberg
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run isolated tests
        run: bash infrastructure/testing/run_tests.sh

      - name: Upload Phase 1 reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fema-phase1-reports
          path: artifacts/test-reports/
          if-no-files-found: warn
          retention-days: 14

  kafka-e2e:
    name: Phase 2 - Kafka Bronze Silver
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run real Kafka to Iceberg pipeline
        run: bash infrastructure/testing/run_kafka_e2e.sh

      - name: Upload Phase 2 reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fema-phase2-reports
          path: artifacts/test-reports/
          if-no-files-found: warn
          retention-days: 14

  video-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Load the same Spark distribution as the pipeline
        run: |
          python -m pip install --only-binary=:all: pytest==8.4.2 coverage==7.10.7
          image=apache/spark:4.1.0-scala2.13-java21-python3-r-ubuntu
          instance=$(docker create "$image")
          docker cp "$instance:/opt/spark" "$RUNNER_TEMP/video-spark"
          docker rm "$instance"
          echo "SPARK_HOME=$RUNNER_TEMP/video-spark" >> "$GITHUB_ENV"
          libraries="$RUNNER_TEMP/video-spark/python/lib"
          py4j=$(ls "$libraries"/py4j-*-src.zip)
          echo "PYTHONPATH=$libraries/pyspark.zip:$py4j" >> "$GITHUB_ENV"
      - name: Test both databases' CDC plans, Spark aliases, Gold and report generation
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_SUBMIT_ARGS: --jars /tmp/iceberg-video.jar pyspark-shell
        run: |
          curl --fail --retry 3 --silent --show-error --output /tmp/iceberg-video.jar https://repo.maven.apache.org/maven2/org/apache/iceberg/iceberg-spark-runtime-4.1_2.13/1.12.0/iceberg-spark-runtime-4.1_2.13-1.12.0.jar
          echo '3123c3798af642dd537230923548e013ef41cc28b6626e5225808cf5670a0f82  /tmp/iceberg-video.jar' | sha256sum -c -
          python -m coverage run --source=. -m pytest -q data_platform/tests/video data_platform/tests/unit data_platform/tests/integration/test_typed_value.py
          python -m coverage xml -o video-coverage.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fema-video-coverage
          path: video-coverage.xml
  sonarqube:
    name: SonarQube Quality Gate
    needs: [unit-and-iceberg, kafka-e2e, video-coverage]
    if: >-
      ${{ success() &&
          vars.SONAR_PROJECT_KEY != '' &&
          vars.SONAR_ORGANIZATION != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download Phase 1 coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fema-phase1-reports
          path: artifacts/test-reports/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fema-video-coverage
          path: artifacts/test-reports/

      - name: Normalize Docker coverage paths
        env:
          CHECKOUT_DIR: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("artifacts/test-reports/coverage.xml")
          tree = ET.parse(report)
          sources = tree.findall(".//sources/source")

          assert sources, "No coverage source entries found"

          for source in sources:
            if source.text and source.text.startswith("/workspace"):
              suffix = source.text.removeprefix("/workspace").lstrip("/")
              source.text = str(Path(os.environ["CHECKOUT_DIR"]) / suffix)

          for cls in tree.findall(".//class"):
            filename = cls.get("filename")
            if filename:
              assert any(
                  (Path(source.text) / filename).is_file()
                  for source in sources
                  if source.text
              ), f"Coverage file not found: {filename}"

          tree.write(report, encoding="utf-8",
                     xml_declaration=True)

          assert all(
              source.text != "/workspace"
              for source in sources
          ), "Docker paths were not normalized"

          print("Coverage paths normalized")
          PY

      - name: Prepare the ASSUREPLUS data dictionary from the migration
        run: bash infrastructure/testing/start_oracle_dictionary.sh

      - name: Run SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.python.version=3.12
            -Dsonar.tests=data_platform/tests,tests,data/source_system/dbs/tests
            -Dsonar.exclusions=data_platform/tests/**,tests/**,data/source_system/dbs/tests/**,**/__pycache__/**
            -Dsonar.plsql.jdbc.url=jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1
            -Dsonar.plsql.jdbc.user=ASSUREPLUS
            -Dsonar.plsql.jdbc.password=${{ env.DICTIONARY_PASSWORD }}
            -Dsonar.plsql.jdbc.driver.path=${{ runner.temp }}/fema-ojdbc.jar
            -Dsonar.plsql.jdbc.driver.class=oracle.jdbc.OracleDriver
            -Dsonar.python.coverage.reportPaths=artifacts/test-reports/coverage.xml,artifacts/test-reports/video-coverage.xml
            -Dsonar.qualitygate.wait=true

      - name: Report this analysis and its issue locations
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ vars.SONAR_ORGANIZATION }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/sonar_video.py "$PROJECT_KEY" --organization "$SONAR_ORG" --pull-request "$PR_NUMBER"

      - name: Verify the master's coverage and security targets
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          python - <<'PY'
          import os
          from scripts.sonar_video import query
          project = os.environ["PROJECT_KEY"]
          gate = query("qualitygates/project_status", projectKey=project, branch="master")["projectStatus"]
          values = {item["metricKey"]: item.get("actualValue") for item in gate["conditions"]}
          metrics = query("measures/component", component=project, branch="master",
                          metricKeys="security_rating,coverage")["component"]["measures"]
          overall = {m["metric"]: m["value"] for m in metrics}
          print("Master Quality Gate:", gate["status"])
          print("Master new-code coverage:", values["new_coverage"])
          print("Master overall coverage:", overall["coverage"])
          print("Master security ratings (1=A), new and overall:", values["new_security_rating"], overall["security_rating"])
          if (gate["status"] != "OK" or float(values["new_coverage"]) < 90
                  or float(values["new_security_rating"]) != 1 or float(overall["security_rating"]) != 1):
              raise SystemExit("Master coverage or security target not reached")
          PY
