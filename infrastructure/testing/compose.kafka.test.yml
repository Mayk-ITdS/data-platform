services:
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - '1'
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://kafka:9092
    mem_limit: 900m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  producer:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ../../:/workspace:ro
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        pip install --disable-pip-version-check --no-cache-dir kafka-python==2.2.15
        python data_platform/tests/integration/seed_kafka_e2e.py
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 300m

  spark:
    image: apache/spark:4.1.0-scala2.13-java21-python3-r-ubuntu
    user: root
    working_dir: /workspace
    environment:
      HOME: /tmp
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_STARTING_OFFSETS: earliest
      BRONZE_CHECKPOINT: /lakehouse/checkpoints/bronze_kafka_e2e
      BRONZE_TRIGGER: availableNow
      MAX_OFFSETS_PER_TRIGGER: '1000'
    volumes:
      - ../../:/workspace:ro
      - spark-kafka-warehouse:/lakehouse
      - ../../artifacts/test-reports:/reports
    entrypoint: ["/opt/spark/bin/spark-submit"]
    mem_limit: 3000m
    cpus: 2

volumes:
  spark-kafka-warehouse:
