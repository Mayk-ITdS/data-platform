apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datapipelines.dataplat.zielinski.io
  creationTimeStamp: OperatorDateNow
spec:
  group: dataplat.zielinski.io
  scope: Namespaced
  names:
    plural: datapipelines
    singular: datapipeline
    kind: DataPipeline
    shortNames:
      -dpipe
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ['sources','kafka']
              properties:
                domain:
                  type: string
                sources:
                  type: array
                  items:
                    type: object
                    required: ["name", "type", "connectionSecretRef"]
                    properties:
                      name:
                        type: string
                      type:
                        enum:
                          - oracle
                          - sqlserver
                          - postgres
                      connectionSecretRef:
                          type: object
                          properties:
                            name:
                              type: string
                          required:
                            - name

                      tables:
                        type: array
                        items:
                          type: object
                          required: ["sourceTable", "primaryKey", "targetEntity"]
                          properties:
                            sourceTable: {type: string}
                            primaryKey: {type: string}
                            targetEntity: {type: string}
                            bronzeTable: {type: string}
                            silverTable: {type: string}
                      cdc:
                        type: object
                        properties:
                          engine: {type: string}
                          snapshot:
                            mode:
                              type: string
                              enum: ["initial", "never", "always"]
                kafka:
                  type: object
                  properties:
                    topicPrefix: {type: string}
                    partitions: {type: integer}
                    replicationFactor: {type: integer}
                    retentionDays: {type: integer}
                    dlqTopic: {type: object}




